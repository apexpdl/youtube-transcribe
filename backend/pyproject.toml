[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = [
    "B008",   # FastAPI uses function calls (Depends/Query) as defaults
    "UP042",  # `class X(str, Enum)` is intentional for clean Pydantic/JSON serialization
]
